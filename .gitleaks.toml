# Repo gitleaks config: default rules, plus one allowlist entry.
# Supabase *publishable* keys are public by design (they ship in the map pages; access is limited
# by row-level security in supabase/ratings.sql). Secret keys (sb_secret_...) are still blocked.
[extend]
useDefault = true

[allowlist]
description = "Supabase publishable key (public)"
regexes = ['''sb_publishable_[A-Za-z0-9_-]+''']
# The minified Kokoro worker bundle (generated by scripts/tts_worker/build.mjs from public packages) trips the
# generic-api-key rule on code such as "this.vocab=new ..."; it holds no secret. Only this one file is skipped.
paths = ['''data/map/tts/kokoro-worker\.js''']

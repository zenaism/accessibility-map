[project]
name = "accessibility-map"
version = "0.1.0"
description = "Multi-source, provenance-tracked wheelchair accessibility data, starting with Cincinnati and Oxford, Ohio"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "pyarrow",
  "pyyaml",
  "requests",
  "tabulate",
]

[project.optional-dependencies]
reddit = ["praw", "python-dotenv"]
# destinations: Overture places (duckdb), web snapshots, event feeds, JS rendering
web = ["duckdb", "beautifulsoup4", "lxml", "pypdf", "icalendar", "playwright", "pillow", "scrapy>=2.13", "trafilatura", "htmldate", "extruct", "pymupdf", "rapidocr-onnxruntime"]
analysis = ["lifelines", "statsmodels", "matplotlib", "rasterio", "libpysal", "esda"]
routing = ["networkx", "scipy"]
dev = ["pytest", "ruff"]

[project.scripts]
atlas = "atlas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/atlas/schema.py" = ["E501"]      # column documentation table
"src/atlas/candidates.py" = ["E501"]  # seed candidate table
"src/atlas/crawler/*.py" = ["E501"]
"tests/crawler_site.py" = ["E501"]
"tests/test_crawler.py" = ["E501"]
"tests/test_crawler_c2.py" = ["E501"]
"tests/test_crawler_c3.py" = ["E501"]
"tests/test_regions.py" = ["E501"]

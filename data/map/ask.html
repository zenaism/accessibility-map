<script>/* Theme boot (session B0). Runs in <head> before first paint, so there is no flash.
   Light is the default. The app never follows the device setting. The choice is kept on this device only.
   API: window.atlasTheme.get() -> "light" | "dark";  window.atlasTheme.set("light" | "dark") -> the theme now in use.
   set() also fires the event atlas:theme-changed on document, detail {theme}. */
(function (w) {
  var KEY = "atlas.theme", root = document.documentElement, cur = "light";
  function read() { try { return w.localStorage.getItem(KEY) === "dark" ? "dark" : "light"; } catch (e) { return "light"; } }
  function apply(t, announce) {
    cur = t === "dark" ? "dark" : "light";
    root.setAttribute("data-theme", cur);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", cur === "dark" ? "#15252E" : "#FFFFFF");
    if (announce) {
      try { document.dispatchEvent(new CustomEvent("atlas:theme-changed", { detail: { theme: cur } })); } catch (e) { /* old browser */ }
    }
  }
  apply(read(), false);
  w.atlasTheme = {
    get: function () { return cur; },
    set: function (t) {
      t = t === "dark" ? "dark" : "light";
      if (t === cur) return cur;
      try { w.localStorage.setItem(KEY, t); } catch (e) { /* storage blocked: the choice lasts until the page closes */ }
      apply(t, true);
      return cur;
    }
  };
  w.addEventListener("storage", function (e) { if (e.key === KEY) { var t = read(); if (t !== cur) apply(t, true); } });
})(window);
</script>

/* Harbor foundation CSS (session B0). Source of truth: src/atlas/web/foundation/harbor.css, served by atlas.ui_foundation.
   Everything is scoped under the .ax class so existing pages are not restyled. Tokens come from the design board's
   style-a-harbor.css; the dark block applies when <html data-theme="dark"> (Light is the default; the app never follows the
   device setting). The map colours (--map-*, --pin-*, --user-dot, --route) are fixed in both themes: the USGS basemap stays light. */
.ax {
  --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --fs-small: 14px; --fs-body: 16px; --fs-lead: 18px; --fs-h2: 22px; --fs-h1: 28px;
  --fw-reg: 400; --fw-med: 600; --fw-bold: 700; --lh: 1.5;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r-sm: 10px; --r-btn: 14px; --r-card: 18px; --r-sheet: 24px; --r-chip: 999px; --r-field: 14px;
  --bw: 1.5px; --btn-h: 48px; --target: 44px; --icon: 24px; --stroke: 2;
  --dur-fast: 140ms; --dur: 220ms; --ease: cubic-bezier(.2,.8,.2,1);
  --map-bg: #E4E7E9; --map-block: #D3D8DB; --map-road: #F8F9FA; --pin-edge: #11181D;
  --pin-yes: #0072B2; --pin-yes-on: #FFFFFF; --pin-partial: #E69F00; --pin-partial-on: #1A1A1A;
  --pin-no: #B84A00; --pin-no-on: #FFFFFF; --pin-unknown: #59646C; --pin-unknown-on: #FFFFFF;
  --user-dot: #B3167B; --route: #1D4ED8;
  --bg: #F3F7F8;
  --surface: #FFFFFF;
  --surface2: #E8EFF1;
  --line: #D5DFE3;
  --text: #10212B;
  --muted: #405560;
  --control: #5A727E;
  --primary: #0B6E75;
  --onprimary: #FFFFFF;
  --primarysoft: #DAF0F1;
  --primarytext: #07565C;
  --focus: #1D4ED8;
  --link: #0B57A4;
  --appbar: #FFFFFF;
  --onappbar: #10212B;
  --yes-bg: #E1EEF8;
  --yes-fg: #04497A;
  --yes-bd: #E1EEF8;
  --partial-bg: #FFF0D1;
  --partial-fg: #6B4000;
  --partial-bd: #FFF0D1;
  --no-bg: #FDE6D8;
  --no-fg: #8A3200;
  --no-bd: #FDE6D8;
  --unknown-bg: #E7EBED;
  --unknown-fg: #3B464E;
  --unknown-bd: #E7EBED;
  --danger-fg: #8F1D1D;
  --danger-bg: #FDEDED;
  --danger-bd: #B42323;
  --warn-fg: #7A4100;
  --warn-bg: #FFF3E0;
  --warn-bd: #B26A00;
  --toast-bg: #10212B;
  --toast-fg: #FFFFFF;
  --shadow: 0 8px 24px rgba(16,33,43,.16), 0 1px 3px rgba(16,33,43,.12);
  color-scheme: light;
}
html[data-theme="dark"] .ax:not([data-theme="light"]), .ax[data-theme="dark"] {
  --bg: #0C171D;
  --surface: #15252E;
  --surface2: #1D313B;
  --line: #2B424E;
  --text: #E9F2F6;
  --muted: #B2C4CE;
  --control: #7E98A5;
  --primary: #47C1C9;
  --onprimary: #05242A;
  --primarysoft: #17414A;
  --primarytext: #7AD6DC;
  --focus: #8FB4FF;
  --link: #8CC4FF;
  --appbar: #15252E;
  --onappbar: #E9F2F6;
  --yes-bg: #0F2E45;
  --yes-fg: #9ED3F7;
  --yes-bd: #0F2E45;
  --partial-bg: #3A2A08;
  --partial-fg: #F5C96A;
  --partial-bd: #3A2A08;
  --no-bg: #3F1D0C;
  --no-fg: #F7A978;
  --no-bd: #3F1D0C;
  --unknown-bg: #25313A;
  --unknown-fg: #C3D0D8;
  --unknown-bd: #25313A;
  --danger-fg: #FFB4B4;
  --danger-bg: #3B1616;
  --danger-bd: #FF8A8A;
  --warn-fg: #FFD08A;
  --warn-bg: #3A2810;
  --warn-bd: #E0A040;
  --toast-bg: #E9F2F6;

  --shadow: 0 8px 24px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);

@media (prefers-reduced-motion: reduce) { .ax { --dur-fast: 0.01ms; --dur: 0.01ms; } }
/* Fixed colour for the rating ring and the focus ring is never overridden below. */

/* Components, shared by all three directions. Everything reads tokens from the data-style wrapper.
   No colour, size or radius is written here: change the token file, not this file. */
.ax { font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh); color: var(--text); background: var(--bg); }
.ax *, .ax *::before, .ax *::after { box-sizing: border-box; }
.ax button, .ax input, .ax select, .ax textarea { font: inherit; color: inherit; }
.ax h1, .ax h2, .ax h3, .ax p { margin: 0; }
.ax .ic { width: var(--icon); height: var(--icon); flex: none; fill: none; stroke: currentColor; stroke-width: var(--stroke); stroke-linecap: round; stroke-linejoin: round; }
.ax :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ax .force-focus { outline: 3px solid var(--focus); outline-offset: 2px; }
.ax .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ax .muted { color: var(--muted); }
.ax .small { font-size: var(--fs-small); }
.ax .h1 { font-size: var(--fs-h1); font-weight: var(--fw-bold); line-height: 1.2; }
.ax .h2 { font-size: var(--fs-h2); font-weight: var(--fw-bold); line-height: 1.25; }
.ax .lead { font-size: var(--fs-lead); font-weight: var(--fw-med); line-height: 1.35; }

/* Buttons */
.ax .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: var(--btn-h); min-width: var(--target); padding: 0 var(--s4); border: var(--bw) solid transparent; border-radius: var(--r-btn); background: var(--surface); color: var(--text); font-weight: var(--fw-med); cursor: pointer; text-decoration: none; white-space: nowrap; position: relative; transition: transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
.ax .btn:active { transform: scale(.98); }
.ax .btn-primary { background: var(--primary); color: var(--onprimary); border-color: var(--primary); }
.ax .btn-secondary { border-color: var(--control); background: var(--surface); }
.ax .btn-ghost { background: transparent; color: var(--primarytext); }
.ax .btn-danger { border-color: var(--danger-bd); color: var(--danger-fg); background: var(--surface); }
.ax .btn-icon { padding: 0; width: var(--target); height: var(--target); min-height: var(--target); border-radius: var(--r-btn); }
.ax .btn-icon.round { border-radius: 999px; }
.ax .theme-toggle { display: inline-flex; align-items: center; justify-content: center; min-width: var(--target); min-height: var(--target); background: none; border: 0; padding: 0 var(--s1); cursor: pointer; border-radius: var(--r-btn); }

.ax.rp .chip .tick { margin-left: auto; order: 3; }

.ax.rp .rp-hint-row { display: flex; justify-content: space-between; gap: var(--s2); }
.ax.rp .rp-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

.ax.rp .banner.errsum { border-color: var(--danger-bd); background: var(--danger-bg); color: var(--danger-fg); }
.ax.rp .banner.errsum ul { margin: var(--s1) 0 0; padding-left: var(--s4); }

.ax.rp .banner:focus { outline: 3px solid var(--focus); outline-offset: 2px; }
.ax.rp .done { display: grid; gap: var(--s3); justify-items: center; text-align: center; }
.ax.rp .done > .block { width: 100%; }
.ax.rp .bigcheck { width: 72px; height: 72px; border-radius: 50%; background: var(--primary); color: var(--onprimary); display: grid; place-items: center; margin-top: var(--s4); }
.ax.rp .bigcheck.off { background: var(--surface2); color: var(--text); border: var(--bw) solid var(--control); }

.ax.rp .timeline .ic { color: var(--primarytext); }

<script>/* Atlas UI foundation (session B0): events, behaviours and small helpers shared by every screen.
   Depends on theme-boot.js (window.atlasTheme). No network requests. Plain ES5 so it runs in every browser we support.

     atlas:open-report   {placeId, region}   Report tab and the place-card Report button.  Owner of the listener: B2
     atlas:open-saved    {}                  Saved tab.                                    Owner: B1
     atlas:open-ask      {placeId?}          Ask tab and "Ask about this place".            Owner: B3

     atlas:theme-changed {theme}             window.atlasTheme.set().                        Anyone

  var real = {};

    catch (e) { bmp = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error('This photo format cannot be used here. Try a JPEG or PNG, or take a new photo.')); im.src = URL.createObjectURL(file); }); }

# Regions are pinned to OSM boundary relations, never matched by name
# ("Manhattan" matched Manhattan, KS in the predecessor project).
# buffer_km: destinations (parks, trails, museums, events) are collected this far outside the
# city limits; street-level layers stay clipped to the city itself. On the device a position
# counts as covered by a region when it is inside bbox grown by buffer_km.
# short: label for a narrow app bar. tier: full (all layers) or limited (places and what the city publishes).
# center [lat, lon] and bbox [south, west, north, east] come from the pinned relation (atlas.regions.describe),
# bbox WITHOUT the buffer. zoom: map zoom for the city.
cincinnati:
  name: Cincinnati, Ohio
  short: Cincinnati
  tier: full
  osm_relation: 183453   # admin_level=8, wikidata Q43196
  buffer_km: 25
  center: [39.1365, -84.5137]
  bbox: [39.0521, -84.7124, 39.221, -84.3696]
  zoom: 12
oxford:
  name: Oxford, Ohio
  short: Oxford
  tier: full
  osm_relation: 182574   # admin_level=8, wikidata Q990940 (includes Miami University main campus)
  buffer_km: 15
  center: [39.5071, -84.7472]
  bbox: [39.4839, -84.7807, 39.5302, -84.7028]
  zoom: 13
dc:
  name: Washington, District of Columbia

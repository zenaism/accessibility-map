# Question categories: everything a wheelchair user might ask about, in one machine-readable list.
# This file drives data fetching and discovery: which OSM tags to query, which Overture categories to
# keep, which words mark a relevant web page, which attributes to extract, how fresh the data must be.
# docs/categories.md is GENERATED from this file (python scripts/make_categories_doc.py): edit here.
#
# Fields
#   label           short name shown to people
#   asks            example questions (used for the evaluation question bank and for keyword ideas)
#   kind            place | route | event | service | infrastructure | condition | information
#   osm             OpenStreetMap selectors (Overpass style, without the bbox); a starting list, extend per region
#   overture        Overture places category hints: UNCHECKED, verify against the current Overture taxonomy
#   attributes      attribute names from config/attributes.yaml to extract (new names live in new_attributes)
#   new_attributes  attributes this category needs that attributes.yaml does not have yet (name: meaning)
#   page_words      words and phrases that mark a relevant web page or PDF (for crawl relevance scoring)
#   sources         source kinds that usually carry this category (see docs/source_types.md letters A to K)
#   refresh_days    how often the data should be re-fetched (null = rarely changes)
#   temporal        true if values expire (events, closures); store valid_from and valid_to
#   priority        P0 first regions, P1 next, P2 later
#   status          have = collected for Cincinnati and Oxford | partial | none

trails_hiking:
  label: Accessible trails and hiking routes
  asks:
    - Is there a paved or hard-packed trail near me?
    - How steep is it, how wide, what surface?
    - Is there accessible parking and a restroom at the trailhead?
    - Can I borrow an all-terrain (track) chair?
  kind: route
  osm:
    - 'way["highway"~"^(path|footway|cycleway|track|bridleway)$"]["name"]'
    - 'relation["route"~"^(hiking|foot|bicycle|walking)$"]'
    - 'nwr["tourism"="viewpoint"]'
  overture: [park, hiking_trail, nature_reserve]
  attributes: [trail_surface, trail_width, trail_grade, accessible_parking, restroom_accessible, seating_rest, all_terrain_chair, mobility_device_policy, notice]
  new_attributes:
    trail_length: "Length of the trail or loop, in km or miles"
    trail_loop: "Loop, out-and-back or one-way"
    trail_cross_slope: "Cross slope of the tread (percent)"
    trail_obstacles: "Roots, steps, gates, narrow bridges, sections not passable"
  page_words: [accessible trail, wheelchair accessible trail, paved trail, ADA trail, universal access, all-terrain chair, track chair, grade, surface, trailhead]
  sources: [A, C, D, K]
  refresh_days: 180
  temporal: false
  priority: P0
  status: partial

